[project]
name = "chorus"
version = "0.1.0"
description = "Slackbot that fans one prompt out to several LLMs and posts every answer in a thread"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "slack-bolt>=1.21",
    "aiohttp>=3.9",
    "anthropic>=1.0",
    "openai>=1.60",
    "google-genai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
chorus = "chorus.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chorus"]
