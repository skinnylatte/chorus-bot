# Every entry here gets the same prompt and posts its own reply in the Slack thread.
# Add, remove, or reorder freely. A provider is skipped if its API key is not set.
#
# provider: openrouter | anthropic | openai | gemini
# model:    the exact model ID the provider's API expects
#           (OpenRouter IDs are vendor/model; see `chorus list-models openrouter`)
# label:    shown in Slack
# emoji:    Slack emoji shortcode shown before the label

system_prompt: >
  You are one of several AI models answering the same question side by side in a Slack thread.
  Answer directly and concisely. Use plain Markdown (bold, bullet points, code blocks);
  do not use tables or headings. In follow-ups you may be shown other models' answers to
  earlier messages, clearly labelled with their names; those are not yours.

max_output_tokens: 4096

# In thread follow-ups, show each model what the other models said in the previous round.
cross_model_context: true

models:
  - provider: openrouter
    model: anthropic/claude-opus-5
    label: Claude Opus 5
    emoji: ":brain:"

  - provider: openrouter
    model: openai/gpt-6-astra
    label: OpenAI GPT-6 Astra
    emoji: ":robot_face:"

  - provider: openrouter
    model: google/gemini-4-argon
    label: Google Gemini 4 Argon
    emoji: ":large_blue_diamond:"

  - provider: openrouter
    model: x-ai/grok-4.7
    label: xAI Grok 4.7
    emoji: ":zap:"

  - provider: openrouter
    model: qwen/qwen3.8-flash
    label: Qwen3.8 Flash
    emoji: ":cloud:"

  # Direct-vendor equivalents, if you'd rather bypass OpenRouter for one of them:
  # - provider: anthropic
  #   model: claude-opus-5
  #   label: Claude Opus 5 (direct)
  #   emoji: ":brain:"
